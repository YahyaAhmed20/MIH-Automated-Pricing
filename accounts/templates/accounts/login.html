{% extends 'frontend/base.html' %}

{% block content %}

<style>
    .login-page {
        min-height: calc(100vh - 80px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
    }

    .login-container {
        width: 100%;
        max-width: 430px;
    }

    .login-card {
        background: #ffffff;
        border-radius: 22px;
        padding: 42px 38px;
        box-shadow: 0 15px 45px rgba(0, 0, 0, 0.08);
        border: 1px solid rgba(0, 0, 0, 0.05);
    }

    .login-logo {
        width: 72px;
        height: 72px;
        margin: 0 auto 22px;
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0d6efd;
        color: white;
        font-size: 30px;
        box-shadow: 0 10px 25px rgba(13, 110, 253, 0.22);
    }

    .login-title {
        text-align: center;
        margin-bottom: 8px;
        font-size: 27px;
        font-weight: 700;
        color: #1f2937;
    }

    .login-subtitle {
        text-align: center;
        color: #6b7280;
        font-size: 14px;
        margin-bottom: 32px;
    }

    .login-label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #374151;
        font-size: 14px;
    }

    .login-input-wrapper {
        position: relative;
        margin-bottom: 20px;
    }

    .login-input {
        width: 100%;
        height: 52px;
        border: 1px solid #dfe3e8;
        border-radius: 12px;
        padding: 0 16px;
        font-size: 15px;
        outline: none;
        transition: all 0.2s ease;
        background: #fafafa;
    }

    .login-input:focus {
        background: #ffffff;
        border-color: #0d6efd;
        box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.08);
    }

    .password-wrapper {
        position: relative;
    }

    .password-wrapper .login-input {
        padding-right: 48px;
    }

    .password-toggle {
        position: absolute;
        right: 14px;
        top: 50%;
        transform: translateY(-50%);
        border: none;
        background: transparent;
        color: #6b7280;
        cursor: pointer;
        font-size: 17px;
    }

    .password-toggle:hover {
        color: #0d6efd;
    }

    .login-button {
        width: 100%;
        height: 52px;
        border: none;
        border-radius: 12px;
        background: #0d6efd;
        color: #ffffff;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s ease;
        margin-top: 8px;
    }

    .login-button:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 20px rgba(13, 110, 253, 0.22);
    }

    .login-button:active {
        transform: translateY(0);
    }

    .login-error {
        background: #fff1f2;
        border: 1px solid #fecdd3;
        color: #be123c;
        border-radius: 10px;
        padding: 11px 14px;
        font-size: 14px;
        margin-bottom: 20px;
        text-align: center;
    }

    .login-footer {
        text-align: center;
        margin-top: 25px;
        color: #9ca3af;
        font-size: 12px;
    }

    @media (max-width: 576px) {
        .login-page {
            padding: 25px 15px;
        }

        .login-card {
            padding: 32px 24px;
        }

        .login-title {
            font-size: 24px;
        }
    }
</style>


<div class="login-page">

    <div class="login-container">

        <div class="login-card">

            <div class="login-logo">
                <i class="fas fa-hospital"></i>
            </div>

            <h1 class="login-title">
                Hospital System
            </h1>

            <p class="login-subtitle">
                تسجيل الدخول إلى نظام المستشفى
            </p>


            {% if login_error %}
    <div class="login-error">
        اسم المستخدم أو كلمة المرور غير صحيحة.
    </div>
{% endif %}

            <form method="POST" autocomplete="off">

                {% csrf_token %}

                <div>
                    <label class="login-label" for="id_username">
                        اسم المستخدم
                    </label>

                    <div class="login-input-wrapper">
                        <input
                            type="text"
                            name="username"
                            id="id_username"
                            class="login-input"
                            placeholder="أدخل اسم المستخدم"
                            autocomplete="username"
                            required
                            autofocus
                        >
                    </div>
                </div>


                <div>
                    <label class="login-label" for="id_password">
                        كلمة المرور
                    </label>

                    <div class="login-input-wrapper password-wrapper">

                        <input
                            type="password"
                            name="password"
                            id="id_password"
                            class="login-input"
                            placeholder="أدخل كلمة المرور"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="passwordToggle"
                            aria-label="إظهار كلمة المرور"
                        >
                            <i class="fas fa-eye"></i>
                        </button>

                    </div>
                </div>


                <button
                    type="submit"
                    class="login-button"
                >
                    <i class="fas fa-sign-in-alt me-2"></i>
                    تسجيل الدخول
                </button>

            </form>


            <div class="login-footer">
                نظام إدارة وتشغيل المستشفى
            </div>

        </div>

    </div>

</div>


<script>
    document.addEventListener("DOMContentLoaded", function () {

        const passwordInput = document.getElementById("id_password");
        const passwordToggle = document.getElementById("passwordToggle");

        if (passwordInput && passwordToggle) {

            passwordToggle.addEventListener("click", function () {

                const icon = this.querySelector("i");

                if (passwordInput.type === "password") {
                    passwordInput.type = "text";
                    icon.classList.remove("fa-eye");
                    icon.classList.add("fa-eye-slash");
                } else {
                    passwordInput.type = "password";
                    icon.classList.remove("fa-eye-slash");
                    icon.classList.add("fa-eye");
                }

            });

        }

    });
</script>

{% endblock %}
