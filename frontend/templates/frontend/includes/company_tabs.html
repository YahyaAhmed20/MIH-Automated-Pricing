<!-- ============================================ -->
<!-- ✅ CSS المخصص للـ Tabs (الحل الأمثل) -->
<!-- ============================================ -->
<style>
    /* ✅ Color Variables */
    :root {
        --primary-blue: #0d6efd;
        --primary-blue-dark: #0b5ed7;
        --primary-blue-darker: #0a58ca;
        --cyan-light: #0dcaf0;
        --gradient-primary: linear-gradient(135deg, #0d6efd, #0dcaf0);
        --gradient-hover: linear-gradient(135deg, #0b5ed7, #0dcaf0);
        --shadow-primary: rgba(13, 110, 253, 0.25);
    }
    
    /* ✅ Tabs Container */
    .tabs-container {
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        margin-bottom: 1.5rem;
        padding: 0.25rem;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
        border: 1px solid rgba(13, 110, 253, 0.05);
    }
    
    .tabs-container::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(90deg, #0d6efd, #0dcaf0, #0d6efd);
        background-size: 200% 100%;
        animation: gradientMove 3s ease infinite;
        opacity: 0.6;
    }
    
    @keyframes gradientMove {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }
    
    .tabs-container:hover {
        box-shadow: 0 8px 35px rgba(13, 110, 253, 0.1);
        transform: translateY(-2px);
    }
    
    /* ✅ Nav Tabs */
    .nav-tabs-custom {
        border-bottom: none;
        padding: 0.5rem 0.5rem 0;
        gap: 0.25rem;
        flex-wrap: wrap;
        margin: 0;
        list-style: none;
        display: flex;
    }
    
    .nav-tabs-custom .nav-item {
        margin-bottom: 0;
        position: relative;
        flex: 0 1 auto;
    }
    
    .nav-tabs-custom .nav-link {
        border: none;
        border-radius: 12px;
        padding: 0.7rem 1.5rem;
        font-weight: 600;
        font-size: 0.9rem;
        color: #6c757d;
        background: transparent;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        overflow: hidden;
        text-decoration: none;
        white-space: nowrap;
    }
    
    .nav-tabs-custom .nav-link i {
        font-size: 1.1rem;
        transition: all 0.4s ease;
        flex-shrink: 0;
    }
    
    /* ✅ النص يظهر دائماً */
    .nav-tabs-custom .nav-link .nav-label {
        display: inline-block;
        transition: all 0.3s ease;
        font-size: 0.9rem;
    }
    
    /* ✅ Shine Effect on Hover */
    .nav-tabs-custom .nav-link::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, 
            transparent, 
            rgba(255, 255, 255, 0.2), 
            transparent
        );
        transition: left 0.6s ease;
        pointer-events: none;
    }
    
    .nav-tabs-custom .nav-link:hover::before {
        left: 100%;
    }
    
    /* ✅ Hover State */
    .nav-tabs-custom .nav-link:hover {
        background: rgba(13, 110, 253, 0.06);
        color: #0d6efd;
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(13, 110, 253, 0.1);
    }
    
    .nav-tabs-custom .nav-link:hover i {
        transform: scale(1.15) rotate(-5deg);
        color: #0d6efd;
    }
    
    /* ✅ Active State */
    .nav-tabs-custom .nav-link.active {
        background: linear-gradient(135deg, #0d6efd, #0dcaf0);
        color: #fff !important;
        box-shadow: 0 4px 20px rgba(13, 110, 253, 0.35);
        transform: translateY(-3px);
        animation: activePulse 2s ease-in-out infinite;
    }
    
    @keyframes activePulse {
        0%, 100% {
            box-shadow: 0 4px 20px rgba(13, 110, 253, 0.35);
        }
        50% {
            box-shadow: 0 6px 35px rgba(13, 110, 253, 0.5);
        }
    }
    
    .nav-tabs-custom .nav-link.active i {
        color: #fff !important;
        transform: scale(1.1);
        animation: iconBounce 0.6s ease;
    }
    
    @keyframes iconBounce {
        0% { transform: scale(0.8) rotate(-10deg); }
        50% { transform: scale(1.3) rotate(5deg); }
        100% { transform: scale(1.1) rotate(0); }
    }
    
    /* ✅ Active Indicator (Glowing Dot) */
    .nav-tabs-custom .nav-link.active::after {
        content: '';
        position: absolute;
        bottom: -2px;
        left: 50%;
        transform: translateX(-50%);
        width: 20px;
        height: 3px;
        background: #fff;
        border-radius: 10px;
        animation: dotSlide 0.5s ease;
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
    }
    
    @keyframes dotSlide {
        0% {
            width: 0;
            opacity: 0;
        }
        100% {
            width: 20px;
            opacity: 1;
        }
    }
    
    /* ✅ Icon Animation on Active */
    .nav-tabs-custom .nav-link.active .bi {
        animation: iconFloat 3s ease-in-out infinite;
    }
    
    @keyframes iconFloat {
        0%, 100% {
            transform: translateY(0) scale(1.1);
        }
        50% {
            transform: translateY(-3px) scale(1.15);
        }
    }
    
    /* ✅ Badge Counter */
    .nav-tabs-custom .nav-link .tab-badge {
        background: rgba(13, 110, 253, 0.1);
        color: #0d6efd;
        font-size: 0.65rem;
        padding: 0.15rem 0.6rem;
        border-radius: 20px;
        font-weight: 700;
        transition: all 0.3s ease;
        margin-left: 4px;
        flex-shrink: 0;
    }
    
    .nav-tabs-custom .nav-link.active .tab-badge {
        background: rgba(255, 255, 255, 0.25);
        color: #fff;
    }
    
    .nav-tabs-custom .nav-link:hover .tab-badge {
        background: rgba(13, 110, 253, 0.2);
        transform: scale(1.05);
    }
    
    /* ✅ Ripple Effect */
    .ripple {
        position: relative;
        overflow: hidden;
    }
    
    .ripple-effect {
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.3);
        transform: scale(0);
        animation: rippleAnimation 0.6s linear;
        pointer-events: none;
    }
    
    @keyframes rippleAnimation {
        to {
            transform: scale(4);
            opacity: 0;
        }
    }
    
    /* ========================================== */
    /* ✅ RESPONSIVE - الحل الأمثل للموبايل */
    /* ========================================== */
    
    /* ✅ للتابلت والأجهزة المتوسطة */
    @media (max-width: 768px) {
        .tabs-container {
            border-radius: 12px;
            padding: 0.15rem;
        }
        
        .nav-tabs-custom {
            padding: 0.25rem;
            gap: 0.15rem;
        }
        
        .nav-tabs-custom .nav-link {
            padding: 0.5rem 1rem;
            font-size: 0.8rem;
            border-radius: 10px;
            gap: 6px;
        }
        
        .nav-tabs-custom .nav-link i {
            font-size: 1rem;
        }
        
        .nav-tabs-custom .nav-link .nav-label {
            font-size: 0.8rem;
        }
        
        .nav-tabs-custom .nav-link .tab-badge {
            font-size: 0.6rem;
            padding: 0.1rem 0.5rem;
        }
        
        .nav-tabs-custom .nav-link.active::after {
            width: 15px;
            height: 2px;
        }
    }
    
    /* ✅ للجوال - النص يظهر بوضوح مع الأيقونة */
    @media (max-width: 576px) {
        .tabs-container {
            border-radius: 10px;
            padding: 0.1rem;
            overflow-x: auto; /* سكرول أفقي لو التابات كتير */
            -webkit-overflow-scrolling: touch;
        }
        
        /* إخفاء السكرول بار */
        .tabs-container::-webkit-scrollbar {
            height: 0;
            display: none;
        }
        
        .tabs-container {
            scrollbar-width: none; /* فايرفوكس */
        }
        
        .nav-tabs-custom {
            padding: 0.2rem;
            gap: 0.1rem;
            flex-wrap: nowrap; /* منع النزول لسطر جديد */
            width: max-content;
            min-width: 100%;
        }
        
        .nav-tabs-custom .nav-item {
            flex: 0 0 auto; /* منع التمدد */
        }
        
        .nav-tabs-custom .nav-link {
            padding: 0.4rem 0.7rem;
            font-size: 0.65rem;
            border-radius: 8px;
            gap: 4px;
            white-space: nowrap;
            min-height: 36px; /* مساحة كافية للضغط */
        }
        
        .nav-tabs-custom .nav-link i {
            font-size: 0.85rem;
        }
        
        /* ✅ النص يظهر دائماً مع تصغير حجمه */
        .nav-tabs-custom .nav-link .nav-label {
            display: inline-block !important; /* منع الإخفاء */
            font-size: 0.6rem;
            font-weight: 600;
        }
        
        .nav-tabs-custom .nav-link .tab-badge {
            font-size: 0.5rem;
            padding: 0.05rem 0.35rem;
            margin-left: 2px;
        }
        
        .nav-tabs-custom .nav-link.active::after {
            width: 12px;
            height: 2px;
            bottom: -1px;
        }
        
        /* تأثير اللمس للجوال */
        .nav-tabs-custom .nav-link:active {
            transform: scale(0.95);
        }
    }
    
    /* ✅ للجوالات الصغيرة جداً */
    @media (max-width: 400px) {
        .nav-tabs-custom .nav-link {
            padding: 0.3rem 0.5rem;
            font-size: 0.55rem;
            gap: 3px;
            min-height: 32px;
        }
        
        .nav-tabs-custom .nav-link i {
            font-size: 0.7rem;
        }
        
        .nav-tabs-custom .nav-link .nav-label {
            font-size: 0.5rem;
        }
        
        .nav-tabs-custom .nav-link .tab-badge {
            font-size: 0.4rem;
            padding: 0.05rem 0.25rem;
        }
    }
    
    /* ✅ للجوالات في وضع الأفقي */
    @media (max-width: 576px) and (orientation: landscape) {
        .nav-tabs-custom .nav-link {
            padding: 0.3rem 0.6rem;
            font-size: 0.6rem;
            min-height: 30px;
        }
        
        .nav-tabs-custom .nav-link i {
            font-size: 0.75rem;
        }
        
        .nav-tabs-custom .nav-link .nav-label {
            font-size: 0.55rem;
        }
    }
    
    /* ✅ Entrance Animations */
    .tabs-container {
        animation: slideDownFade 0.6s ease;
    }
    
    @keyframes slideDownFade {
        0% {
            opacity: 0;
            transform: translateY(-20px) scale(0.95);
        }
        100% {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }
    
    .nav-tabs-custom .nav-item {
        animation: fadeInUp 0.5s ease backwards;
    }
    
    .nav-tabs-custom .nav-item:nth-child(1) { animation-delay: 0.05s; }
    .nav-tabs-custom .nav-item:nth-child(2) { animation-delay: 0.1s; }
    .nav-tabs-custom .nav-item:nth-child(3) { animation-delay: 0.15s; }
    .nav-tabs-custom .nav-item:nth-child(4) { animation-delay: 0.2s; }
    .nav-tabs-custom .nav-item:nth-child(5) { animation-delay: 0.25s; }
    
    @keyframes fadeInUp {
        0% {
            opacity: 0;
            transform: translateY(10px) scale(0.9);
        }
        100% {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }
    
    /* ✅ Tooltip Style */
    .nav-tabs-custom .nav-link[title] {
        position: relative;
    }
    
    /* ✅ Dark Mode Support */
    @media (prefers-color-scheme: dark) {
        .tabs-container {
            background: #1a1a2e;
            border-color: rgba(255, 255, 255, 0.05);
        }
        
        .nav-tabs-custom .nav-link {
            color: #a0a0b8;
        }
        
        .nav-tabs-custom .nav-link:hover {
            background: rgba(13, 110, 253, 0.12);
            color: #0dcaf0;
        }
        
        .nav-tabs-custom .nav-link .tab-badge {
            background: rgba(13, 110, 253, 0.2);
            color: #0dcaf0;
        }
        
        .nav-tabs-custom .nav-link.active .tab-badge {
            background: rgba(255, 255, 255, 0.25);
            color: #fff;
        }
    }
</style>

<!-- ============================================ -->
<!-- ✅ JavaScript للـ Ripple Effect والتحسينات -->
<!-- ============================================ -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        
        // ==========================================
        // ✅ Ripple Effect on Click
        // ==========================================
        document.querySelectorAll('.ripple').forEach(function(btn) {
            btn.addEventListener('click', function(e) {
                const rect = this.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                const ripple = document.createElement('span');
                ripple.className = 'ripple-effect';
                ripple.style.left = x + 'px';
                ripple.style.top = y + 'px';
                ripple.style.width = '20px';
                ripple.style.height = '20px';
                
                this.appendChild(ripple);
                
                setTimeout(function() {
                    ripple.remove();
                }, 600);
            });
        });
        
        // ==========================================
        // ✅ Smooth Tab Switching with Animation
        // ==========================================
        document.querySelectorAll('.nav-tabs-custom .nav-link').forEach(function(link) {
            link.addEventListener('click', function(e) {
                const currentActive = document.querySelector('.nav-tabs-custom .nav-link.active');
                if (currentActive && currentActive !== this) {
                    // ✅ Add exit animation to current
                    currentActive.style.transition = 'all 0.3s ease';
                    currentActive.style.transform = 'scale(0.95)';
                    currentActive.style.opacity = '0.5';
                    
                    setTimeout(function() {
                        currentActive.style.transform = '';
                        currentActive.style.opacity = '';
                    }, 300);
                }
                
                // ✅ Add entry animation to new
                this.style.transition = 'all 0.4s cubic-bezier(0.4, 0, 0.2, 1)';
            });
        });
        
        // ==========================================
        // ✅ Keyboard Navigation (Arrow Keys)
        // ==========================================
        document.addEventListener('keydown', function(e) {
            const tabs = document.querySelectorAll('.nav-tabs-custom .nav-link:not(.active)');
            const activeTab = document.querySelector('.nav-tabs-custom .nav-link.active');
            
            if (!activeTab) return;
            
            const tabArray = Array.from(document.querySelectorAll('.nav-tabs-custom .nav-link'));
            const currentIndex = tabArray.indexOf(activeTab);
            
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                const nextIndex = (currentIndex + 1) % tabArray.length;
                tabArray[nextIndex].click();
                tabArray[nextIndex].focus();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                const prevIndex = (currentIndex - 1 + tabArray.length) % tabArray.length;
                tabArray[prevIndex].click();
                tabArray[prevIndex].focus();
            }
        });
        
        // ==========================================
        // ✅ Scroll to active tab on load
        // ==========================================
        const activeTab = document.querySelector('.nav-tabs-custom .nav-link.active');
        if (activeTab) {
            setTimeout(function() {
                activeTab.scrollIntoView({ 
                    behavior: 'smooth', 
                    block: 'nearest',
                    inline: 'center'
                });
            }, 500);
        }
        
        // ==========================================
        // ✅ Touch feedback for mobile
        // ==========================================
        if ('ontouchstart' in window) {
            document.querySelectorAll('.nav-tabs-custom .nav-link').forEach(function(link) {
                link.addEventListener('touchstart', function() {
                    this.style.transition = 'transform 0.1s ease';
                    this.style.transform = 'scale(0.97)';
                }, { passive: true });
                
                link.addEventListener('touchend', function() {
                    this.style.transform = '';
                }, { passive: true });
            });
        }
        
        console.log('✅ Tabs component initialized successfully!');
        
    });
</script>
